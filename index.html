<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Presentaciones DesarrollAndo</title>
<link rel="icon" href="assets/isotipo-desarrollando.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root{--fondo:#0a0a0b;--tarjeta:#141417;--linea:#2a2a2f;--texto:#f5f5f6;--suave:#b4b4bc;--arcoiris:linear-gradient(90deg,#8700ff 0%,#ff00ff 18%,#ff0000 36%,#ff8200 52%,#ffd900 66%,#00ff00 82%,#03ffff 100%)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Open Sans',system-ui,sans-serif}
a{color:inherit}
.franja{height:5px;background:var(--arcoiris)}
/* Inicio */
.inicio{max-width:1080px;margin:0 auto;padding:48px 16px 64px}
.marca{display:flex;align-items:center;gap:12px}
.marca img{width:34px;height:34px;object-fit:contain}
.marca span{font-family:'Archivo',sans-serif;font-weight:800;font-size:18px}
h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(34px,6vw,58px);line-height:1;letter-spacing:-.03em;margin:40px 0 12px}
.rb{background:var(--arcoiris);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro{color:var(--suave);font-size:16px;line-height:1.6;max-width:560px;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:22px;color:var(--texto);font:inherit;cursor:pointer;min-height:200px;transition:border-color .15s,transform .15s}
.card:hover,.card:focus-visible{border-color:var(--acento);transform:translateY(-2px);outline:none}
.card:focus-visible{box-shadow:0 0 0 3px var(--acento)}
.punto{width:36px;height:6px;border-radius:6px;background:var(--acento)}
.card small{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acento)}
.card strong{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;line-height:1.15}
.card p{margin:0;color:var(--suave);font-size:14px;line-height:1.5}
.card .ir{margin-top:auto;font-weight:700;font-size:14px}
.pie{margin-top:40px;color:var(--suave);font-size:12px}
/* Visor */
.visor{position:fixed;inset:0;display:none;flex-direction:column;background:var(--fondo)}
body.viendo .visor{display:flex}
body.viendo .inicio{display:none}
.barra{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--linea);background:#0f0f11;flex-wrap:wrap}
.barra img{width:24px;height:24px;object-fit:contain}
.barra select,.barra button,.barra a.btn{height:36px;border-radius:9px;border:1px solid var(--linea);background:var(--tarjeta);color:var(--texto);font:600 14px 'Open Sans',sans-serif;padding:0 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.barra select{max-width:60vw}
.barra button:hover,.barra a.btn:hover,.barra select:hover{border-color:#5a5a62}
.barra .esp{flex:1}
iframe{flex:1;width:100%;border:0;background:#fff}
@media (max-width:560px){.barra .ocultable{display:none!important}}
</style>
</head>
<body>
<div class="franja"></div>

<main class="inicio">
  <div class="marca"><img src="assets/isotipo-desarrollando.png" alt=""><span>DesarrollAndo</span></div>
  <h1>Elige la <span class="rb">presentación</span></h1>
  <p class="intro">Ábrela aquí mismo, cámbiala desde la barra superior o ponla en pantalla completa para la reunión.</p>
  <div class="grid" id="grid"></div>
  <p class="pie">desarrollando.co · Te llevamos al próximo paso con tu empresa.</p>
</main>

<div class="visor" aria-live="polite">
  <div class="barra">
    <button type="button" id="volver" aria-label="Volver al inicio">← Inicio</button>
    <img src="assets/isotipo-desarrollando.png" alt="" class="ocultable">
    <label for="sel" class="ocultable" style="position:absolute;left:-9999px">Presentación</label>
    <select id="sel" aria-label="Presentación"></select>
    <span class="esp"></span>
    <a class="btn ocultable" id="sola" target="_blank" rel="noopener">Abrir sola</a>
    <button type="button" id="completa">Pantalla completa</button>
  </div>
  <iframe id="marco" title="Presentación" allow="clipboard-write; fullscreen"></iframe>
</div>

<script>
var PRESENTACIONES = [
  { id: 'contratando-presentacion', archivo: 'p/contratando.html', marca: 'ContratAndo', titulo: 'Presentación ContratAndo', texto: 'Cómo funciona: filtros automáticos, tablero, WhatsApp, entrevista por voz con IA, pruebas, tres formas de pago con ejemplo de 20 operativos y cuánto te ahorras frente a temporal, agencia y otra plataforma.', acento: '#8635F6' },
  { id: 'contratando', archivo: 'p/contratando-simulador.html', marca: 'ContratAndo', titulo: 'Simulador de costos de contratación', texto: 'Compara lo que cuesta contratar con una temporal, una firma de selección o tu propio equipo frente a ContratAndo.', acento: '#B794F6' },
  { id: 'hoteles-servicios', archivo: 'p/hoteles-servicios.html', marca: 'DesarrollAndo Hoteles', titulo: 'Hoteles: servicios por separado', texto: 'Para alojamientos pequeños: 1) Flow con asistente de IA que atiende, cotiza y reserva 24/7, 2) asesoría en pauta y 3) web con CRM y motor de reservas.', acento: '#ffd900' },
  { id: 'hoteles', archivo: 'p/hoteles.html', marca: 'DesarrollAndo Hoteles', titulo: 'Presentación Hoteles', texto: 'Atención, reservas y marketing para hoteles, glampings y alojamientos.', acento: '#ff8200' },
  { id: 'plan-arranque', archivo: 'p/plan-arranque.html', marca: 'DesarrollAndo Hoteles', titulo: 'Plan Arranque con panel de reservas (maqueta)', texto: 'Pauta con 1 anuncio y revisión mensual, asistente que consulta disponibilidad y panel donde el dueño confirma y envía el enlace de pago; calendario, reportes y configuración por país. Precios de referencia.', acento: '#d4790f' },
  { id: 'plataforma-hoteles', archivo: 'p/plataforma-hoteles.html', marca: 'DesarrollAndo Hoteles', titulo: 'Plataforma para alojamientos (maqueta)', texto: 'Planes Cabaña, Casa, Posada y Hotel, calculadora de comisión de portal, panel del dueño, web del huésped con recepcionista y conversaciones. Precios de referencia.', acento: '#85caee' },
  { id: 'cti', archivo: 'p/cti.html', marca: 'Flow Omnicanal', titulo: 'CTI Flow Omnicanal', texto: 'Contact center en el navegador: voz y WhatsApp, supervisión en vivo, grabación y transcripción, reportes y videos de la plataforma. Licencia de 100.000 COP por usuario, telefonía a 46 COP el minuto y puesta en marcha de 4.900.000 COP.', acento: '#8B5CF6' },
  { id: 'flow', archivo: 'p/flow.html', marca: 'Flow', titulo: 'Flow para tu negocio', texto: 'Atención y ventas omnicanal con asistentes de IA en WhatsApp, Instagram, Facebook y web.', acento: '#8fcff2' },
  { id: 'bailando', archivo: 'p/bailando.html', marca: 'Bailando', titulo: 'Bailando: boletería, puerta y caja', texto: 'Para discotecas, bares y organizadores: recorrido por los módulos de la plataforma, demos de cupo, puerta sin señal y palcos, y calculadora de la comisión (0 % el primer evento, tope de 9 %).', acento: '#CAFF42' },
  { id: 'bailando-primeros-pasos', archivo: 'p/bailando-primeros-pasos.html', marca: 'Bailando', titulo: 'Primeros pasos con Bailando', texto: 'Guía de inicio para clientes recién registrados: 7 pasos con capturas reales del panel, del negocio y el cobro hasta la noche del evento, con una lista de tareas que guarda el avance.', acento: '#CAFF42' },
  { id: 'brochure', archivo: 'p/brochure.html', marca: 'DesarrollAndo', titulo: 'Portfolio DesarrollAndo 2026', texto: 'Software, IA, Talento, Leads y Hoteles, con casos de Flow, ContratAndo, Studio, Whatrack, TUSISO, Bailando y Speaking.', acento: '#4dff6a' }
];
var $ = function (id) { return document.getElementById(id); };

$('grid').innerHTML = PRESENTACIONES.map(function (p) {
  return '<button type="button" class="card" data-id="' + p.id + '" style="--acento:' + p.acento + '">' +
    '<span class="punto"></span><small>' + p.marca + '</small><strong>' + p.titulo + '</strong><p>' + p.texto + '</p>' +
    '<span class="ir">Abrir →</span></button>';
}).join('');
$('sel').innerHTML = PRESENTACIONES.map(function (p) { return '<option value="' + p.id + '">' + p.titulo + '</option>'; }).join('');

function mostrar(id) {
  var p = PRESENTACIONES.find(function (x) { return x.id === id; });
  if (!p) {
    document.body.classList.remove('viendo');
    $('marco').removeAttribute('src');
    document.title = 'Presentaciones DesarrollAndo';
    return;
  }
  document.body.classList.add('viendo');
  if ($('marco').getAttribute('src') !== p.archivo) $('marco').src = p.archivo;
  $('sel').value = p.id;
  $('sola').href = p.archivo;
  document.title = p.titulo + ' · DesarrollAndo';
}
function irA(id) { location.hash = id ? '#' + id : ''; }

$('grid').addEventListener('click', function (e) { var c = e.target.closest('.card'); if (c) irA(c.dataset.id); });
$('sel').addEventListener('change', function (e) { irA(e.target.value); });
$('volver').addEventListener('click', function () { irA(''); });
$('completa').addEventListener('click', function () {
  var m = $('marco');
  var f = m.requestFullscreen || m.webkitRequestFullscreen;
  if (f) f.call(m); else window.open(m.getAttribute('src'), '_blank');
});
addEventListener('hashchange', function () { mostrar(location.hash.slice(1)); });
mostrar(location.hash.slice(1));
</script>
</body>
</html>
