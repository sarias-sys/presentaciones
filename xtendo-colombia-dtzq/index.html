<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/isotipo-desarrollando.png">
<title>Propuesta Xtendo Colombia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de lectura que pasa por video, plataforma, cargos y opciones, y termina en una mesa de trabajo (entradas | resultado) y un comparativo. */
:root{
  --bg:#f6f5fa; --surface:#ffffff; --sunk:#efedf6; --ink:#1b1530; --muted:#5b5672; --line:#e2deee;
  --accent:#6a35d4; --accent-ink:#ffffff; --accent-soft:#ece5fb; --good:#0d7a48; --good-soft:#e2f4ea; --warn:#9a5b00; --warn-soft:#fbefd9;
  --comp:#8d879f; --b:#2d6fb8; --c:#b5547c;
  --f-display:"Poppins","Noto Sans", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Poppins","Noto Sans", ui-sans-serif, system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-sm:6px; --r-md:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110f18; --surface:#1a1724; --sunk:#14121c; --ink:#f1eef9; --muted:#aaa4bf; --line:#2d293d;
  --accent:#b197fc; --accent-ink:#160f2b; --accent-soft:#2a2242; --good:#5fd49a; --good-soft:#163428; --warn:#f0b65c; --warn-soft:#3a2b12; --comp:#6f6985; --b:#6fa8e8; --c:#e38fb3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110f18; --surface:#1a1724; --sunk:#14121c; --ink:#f1eef9; --muted:#aaa4bf; --line:#2d293d;
  --accent:#b197fc; --accent-ink:#160f2b; --accent-soft:#2a2242; --good:#5fd49a; --good-soft:#163428; --warn:#f0b65c; --warn-soft:#3a2b12; --comp:#6f6985; --b:#6fa8e8; --c:#e38fb3; color-scheme:dark}
html[lang="el"]{--f-display:"Noto Sans", ui-sans-serif, system-ui, sans-serif; --f-body:"Noto Sans", ui-sans-serif, system-ui, sans-serif}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:300;font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.wrap{max-width:1140px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.14;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem, 4vw, 2.9rem);font-weight:700;letter-spacing:-0.01em}
h2{font-size:clamp(1.3rem, 2.4vw, 1.8rem)}
h3{font-size:1.02rem}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500}
html[lang="el"] .eyebrow{font-family:var(--f-body);letter-spacing:.08em;font-weight:600}
.lede{color:var(--muted);max-width:66ch;font-size:1.02rem}
.num{font-variant-numeric:tabular-nums}
section{padding-block:44px 6px;display:grid;gap:18px}
section > header{display:grid;gap:8px}
.note{font-size:.84rem;color:var(--muted)}

/* Barra superior */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:"Poppins",sans-serif;font-weight:600;font-size:1.15rem;color:var(--accent)}
.brand small{display:block;font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;gap:3px;background:var(--sunk);padding:3px;border-radius:var(--r-md);max-width:100%;overflow-x:auto}
.seg button{font:inherit;font-weight:500;font-size:.82rem;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
button:focus-visible, input:focus-visible, summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;font-size:.76rem;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}

/* Portada */
.hero{padding-block:34px 4px;display:grid;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:2px;align-content:start}
.fact b{font-family:var(--f-display);font-weight:600;font-size:1.45rem}
.fact span{color:var(--muted);font-size:.85rem}
.fact.hl{border-color:var(--accent)}
.fact.hl b{color:var(--accent)}

/* Video */
.video{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:820px){.video{grid-template-columns:1fr}}
.vbox{background:#0e0c16;border-radius:var(--r-md);overflow:hidden;aspect-ratio:16/9;max-width:100%}
.vbox video{width:100%;height:100%;display:block;object-fit:contain;background:#0e0c16}

/* Tarjetas de la plataforma */
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:grid;gap:6px;align-content:start}
.cap .k{font-family:var(--f-mono);font-size:.72rem;color:var(--accent)}
.cap p{color:var(--muted);font-size:.9rem}

/* Automatizaciones */
.auto{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1.4fr);gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .when{font-weight:500}
.arow .arr{color:var(--accent);text-align:center}
.arow .what{color:var(--muted)}
@media (max-width:560px){.arow{grid-template-columns:1fr}.arow .arr{display:none}.arow .what{padding-left:12px;border-left:2px solid var(--accent-soft)}}

/* Tablas */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:collapse;width:100%}
.tbl table{min-width:760px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;background:var(--sunk)}
html[lang="el"] th{letter-spacing:.03em}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{background:var(--sunk);font-weight:500}
.role{font-weight:500}
.sub{color:var(--muted);font-size:.83rem}
.tests{display:flex;flex-wrap:wrap;gap:5px}
.t{font-family:var(--f-mono);font-size:.7rem;padding:2px 7px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent)}
.t.v{background:var(--good-soft);color:var(--good);font-family:var(--f-body)}
.price{font-family:var(--f-display);font-weight:600;font-size:1.08rem}
.save{color:var(--good);font-weight:500;font-size:.83rem}
.best{display:inline-block;font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--good-soft);color:var(--good);margin-left:6px;white-space:nowrap}
td.win{background:var(--good-soft)}
tr.ours td{background:var(--accent-soft)}
tr.ours td.role{color:var(--accent)}

/* Opciones */
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.model{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--mc,var(--accent));border-radius:var(--r-md);padding:18px;display:grid;gap:10px;align-content:start}
.model .tag{font-family:var(--f-mono);font-size:.74rem;color:var(--mc,var(--accent));font-weight:500}
.model ul{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--muted);font-size:.9rem}
.model .who{border-top:1px dashed var(--line);padding-top:10px;font-size:.86rem}
.model .who b{font-weight:500}
.mA{--mc:var(--accent)} .mB{--mc:var(--b)} .mC{--mc:var(--c)}
.termnote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;font-size:.92rem}
.termnote b{color:var(--accent);font-weight:600}

/* Calculadora */
.calc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.calc{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;display:grid;gap:16px;min-width:0}
.grid-in{overflow-x:auto}
.grid-in table{min-width:440px}
.grid-in td,.grid-in th{padding:7px 8px}
input[type=number]{font:inherit;font-family:var(--f-mono);font-size:.86rem;width:100%;min-width:62px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);color:var(--ink);text-align:right}
.row-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label.f{display:grid;gap:5px;font-size:.8rem;color:var(--muted);align-content:end}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:500;font-size:.9rem}
details[open] summary{margin-bottom:12px}
.res{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px)}
.bars{display:grid;gap:12px}
.bar{display:grid;gap:4px}
.bar .lab{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;align-items:baseline}
.bar .lab b{font-weight:600}
.track{height:12px;background:var(--sunk);border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--accent);transition:width .35s cubic-bezier(.16,1,.3,1)}
.fill.m{background:var(--comp)} .fill.B{background:var(--b)} .fill.C{background:var(--c)}
.bar .meta{font-size:.78rem;color:var(--muted)}
.headline{display:grid;gap:2px}
.headline .k{font-size:.8rem;color:var(--muted)}
.headline .v{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,3.6vw,2.2rem);line-height:1.1;color:var(--good)}

/* Condiciones y resumen */
.conds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.cond{border-top:2px solid var(--accent);padding-top:10px;display:grid;gap:4px;align-content:start}
.cond p{color:var(--muted);font-size:.9rem}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:22px;display:grid;gap:16px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.sumgrid > div{display:grid;gap:4px;padding:12px 14px;border-radius:var(--r-sm);background:var(--sunk)}
.sumgrid .tag{font-family:var(--f-mono);font-size:.74rem;font-weight:500}
.sumgrid .amt{font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.src{font-size:.8rem;color:var(--muted);display:grid;gap:4px}
.src a{color:var(--accent)}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:.84rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

/* Añadidos v2: pruebas, piloto, opcionales, regiones */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;display:grid;gap:4px;align-content:start}
.tcard .t{justify-self:start}
.tcard p{font-size:.86rem;color:var(--muted)}
.tcard .basis{font-size:.8rem;color:var(--ink);border-left:2px solid var(--accent-soft);padding-left:8px}
.pilot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.pilot{grid-template-columns:1fr}}
.pilot ul{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--muted);font-size:.92rem}
.steps{display:grid;gap:10px;counter-reset:st;margin:0;padding:0;list-style:none}
.steps li{counter-increment:st;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(st);font-family:var(--f-mono);font-weight:600;width:26px;height:26px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem}
.steps b{font-weight:600}
.steps span{color:var(--muted);font-size:.9rem;display:block}
.addons{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.addon{border:1px dashed var(--accent);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:6px;background:var(--surface)}
.addon h3{color:var(--accent)}
.addon p{font-size:.9rem;color:var(--muted)}
.addon .pp{display:flex;flex-wrap:wrap;gap:8px}
.addon .pp span{font-size:.84rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.bandlist{list-style:none;padding:0!important;margin:0;display:grid;gap:0!important;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.bandlist li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);color:var(--ink)}
.bandlist li:last-child{border-bottom:0}
.bandlist li b{font-weight:600;color:var(--c)}
.bandlist li.on{background:var(--good-soft)}
.regnote{font-size:.84rem;color:var(--muted)}
tr.reg-h td{background:var(--sunk);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.df-us{border-color:var(--accent)!important;background:var(--accent-soft)!important}
.df-us h3{color:var(--accent)}
.pilot .panel{align-content:start}
select{font:inherit;font-size:.9rem;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);color:var(--ink)}
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <div class="brand">ContratAndo<small>by DesarrollAndo · Meta Business Partner</small></div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Tema / Theme" id="themeSeg">
        <button type="button" data-theme-set="light" data-i="thL"></button><button type="button" data-theme-set="dark" data-i="thD"></button>
      </div>
      <div class="seg" role="group" aria-label="Idioma / Language" id="langSeg">
        <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
      </div>
      <div class="seg" role="group" aria-label="COP / USD" id="curSeg">
        <button type="button" data-cur="COP">$ COP</button><button type="button" data-cur="USD">US$ USD</button>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="eyebrow" data-i="heroEy"></div>
    <h1 data-i="h1"></h1>
    <p class="lede" data-i="lede"></p>
    <div class="facts">
      <div class="fact"><b class="num" id="f1v"></b><span id="f1t"></span></div>
      <div class="fact"><b class="num" id="f2v"></b><span data-i="f2"></span></div>
      <div class="fact"><b class="num" id="f3v"></b><span data-i="f3"></span></div>
      <div class="fact hl"><b class="num" id="f4v"></b><span data-i="f4"></span></div>
    </div>
  </div>

  <section>
    <header>
      <div class="eyebrow" data-i="plEy"></div>
      <h2 data-i="plH"></h2>
      <p class="lede" data-i="plP"></p>
    </header>
    <div class="pilot">
      <div class="panel"><h3 data-i="plFH"></h3><ul id="plF"></ul></div>
      <div class="panel"><h3 data-i="plSH"></h3><ol class="steps" id="plS"></ol></div>
    </div>
    <p class="note" data-i="plNote"></p>
  </section>

  <section>
    <div class="video">
      <div class="vbox"><video id="vid" controls playsinline preload="metadata" poster="video/poster-es.jpg"><source id="vsrc" src="video/contratando-es.mp4" type="video/mp4"></video></div>
      <div style="display:grid;gap:10px">
        <div class="eyebrow" data-i="vEy"></div>
        <h2 data-i="vH"></h2>
        <p class="lede" data-i="vP"></p>
      </div>
    </div>
  </section>

  <section>
    <header>
      <div class="eyebrow" data-i="pEy"></div>
      <h2 data-i="pH"></h2>
    </header>
    <div class="caps" id="caps"></div>
  </section>

  <section>
    <header>
      <div class="eyebrow" data-i="tmEy"></div>
      <h2 data-i="tmH"></h2>
      <p class="lede" data-i="tmP"></p>
    </header>
    <div class="pilot">
      <div class="panel">
        <h3 data-i="tmMan"></h3>
        <div class="grid-in"><table style="min-width:0"><tbody id="tmBody"></tbody></table></div>
        <p class="note" id="tmDays" style="font-weight:500;color:var(--ink)"></p>
        <p class="note" data-i="tmRep"></p>
        <div class="row-in">
          <label class="f" for="tm1"><span id="tml0"></span><input id="tm1" type="number" min="0" step="1" value="10"></label>
          <label class="f" for="tm2"><span id="tml1"></span><input id="tm2" type="number" min="0" step="1" value="3"></label>
          <label class="f" for="tm3"><span id="tml2"></span><input id="tm3" type="number" min="0" max="100" step="5" value="20"></label>
        </div>
      </div>
      <div class="panel df-us">
        <h3 data-i="tmCa"></h3>
        <div class="headline"><span class="v num" data-i="tmBig" style="color:var(--accent)"></span></div>
        <ol class="steps" id="tmSteps"></ol>
        <p class="note" data-i="tmMass" style="color:var(--ink);font-weight:500"></p>
      </div>
    </div>
    <p class="note" data-i="tmNote"></p>
  </section>


  <section>
    <header>
      <div class="eyebrow" data-i="oEy"></div>
      <h2 data-i="oH"></h2>
      <p class="lede" data-i="oP"></p>
    </header>
    <div class="models" id="models"></div>
    <div class="termnote"><span data-i="termNote"></span></div>
    <div style="display:grid;gap:8px;margin-top:6px"><h3 data-i="btH"></h3><p class="note" id="btP"></p></div>
    <div class="tbl"><table>
      <thead><tr><th id="bt0"></th><th class="r" id="bt1"></th><th class="r" id="bt2"></th></tr></thead>
      <tbody id="btBody"></tbody>
    </table></div>
    <div style="display:grid;gap:8px;margin-top:6px"><h3 data-i="svH"></h3><p class="note" id="svP"></p></div>
    <div class="tbl"><table>
      <thead><tr><th id="sv0"></th><th class="r" id="sv1"></th><th class="r" id="sv2"></th></tr></thead>
      <tbody id="svBody"></tbody>
    </table></div>
    <p class="note" id="svNote"></p>
    <div class="addons" id="addons"></div>
  </section>


  <section>
    <header>
      <div class="eyebrow" data-i="rEy"></div>
      <h2 data-i="rH"></h2>
      <p class="lede" data-i="rP"></p>
    </header>
    <div class="tbl"><table>
      <thead><tr><th data-i="thRole"></th><th data-i="thMarket"></th><th data-i="thTests"></th><th class="r" data-i="thAvg"></th><th class="r">ContratAndo (A)</th></tr></thead>
      <tbody id="roleBody"></tbody>
    </table></div>
    <p class="note" data-i="rNote"></p>
  </section>

  <section>
    <header>
      <div class="eyebrow" data-i="tEy"></div>
      <h2 data-i="tH"></h2>
      <p class="lede" data-i="tP"></p>
    </header>
    <div class="tgrid" id="tgrid"></div>
    <p class="note" data-i="tCaution"></p>
    <div class="tbl"><table>
      <thead><tr><th data-i="tth1"></th><th class="r" data-i="tth2"></th><th class="r" data-i="tth3"></th><th class="r" data-i="tth4"></th></tr></thead>
      <tbody id="testBody"></tbody>
    </table></div>
  </section>

  <section>
    <header>
      <div class="eyebrow" data-i="mkEy"></div>
      <h2 data-i="mkH"></h2>
      <p class="lede" data-i="mkP"></p>
    </header>

  function money(cop,dec){
    const v=cur==="USD"?cop/TRM:cop;
    const d=cur==="USD"?(dec!==undefined?dec:(Math.abs(v)<100?2:0)):0;
    return new Intl.NumberFormat(locale(),{style:"currency",currency:cur,currencyDisplay:cur==="COP"&&lang==="en"?"code":"symbol",minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
  }
  const pctTxt=p=>{const s=new Intl.NumberFormat(locale(),{maximumFractionDigits:2}).format(p);return lang==="es"?`${s} %`:`${s}%`;};
  const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]!==undefined?o[k]:"{"+k+"}");
  const bandOf=n=>BANDS.find(b=>n>=b[0]&&n<=b[1])||BANDS[0];
  const bandLabel=b=>{const t=L(), f=x=>new Intl.NumberFormat(locale()).format(x); return b[1]===Infinity?fill(t.bandTop,{a:f(b[0])}):fill(t.bandRow,{a:`${f(b[0])}–${f(b[1])}`});};

  $("inBody").innerHTML=ROLES.map((r,i)=>`<tr><td class="role" data-rn="${i}"></td>
    <td><input type="number" id="p${i}" min="0" step="1" value="${r.people}"></td>
    <td><input type="number" id="s${i}" min="0" step="10000" value="${r.sal}"></td></tr>`).join("");

  const num=id=>{const v=parseFloat($(id).value);return isFinite(v)&&v>=0?v:0};

  function renderStatic(){
    const t=L();
    document.documentElement.lang=lang;
    document.querySelectorAll("[data-i]").forEach(el=>{const v=t[el.dataset.i]; if(typeof v==="string") el.innerHTML=v;});
    document.querySelectorAll("[data-rn]").forEach(el=>{el.textContent=t.roles[ROLES[+el.dataset.rn].k][0]});
    document.querySelectorAll("#langSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
    document.querySelectorAll("#curSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.cur===cur)));
    document.querySelectorAll("#termSeg button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.term===term)));
    const C=COUNTRIES[country];
    $("ctry").innerHTML=Object.keys(COUNTRIES).map(k=>`<option value="${k}"${k===country?" selected":""}>${t.cNames[k]}</option>`).join("");
    $("ctryL").textContent=t.cCountry; $("minL").textContent=fill(t.cMin,{c:C.cur});
    $("thSalCol").textContent=fill(t.thSal,{c:C.cur});
    $("ctryNote").textContent=fill(t.cNote,{bob:new Intl.NumberFormat(locale(),{maximumFractionDigits:2}).format(TRM/12.12)});
    $("caps").innerHTML=t.caps.map((c,i)=>`<div class="cap"><span class="k">0${i+1}</span><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("");
    $("autos").innerHTML=t.autos.map(a=>`<div class="arow"><span class="when">${a[0]}</span><span class="arr" aria-hidden="true">→</span><span class="what">${a[1]}</span></div>`).join("");
    $("plF").innerHTML=t.plF.map(x=>`<li>${x}</li>`).join("");
    t.tmIn.forEach((x,i)=>$("tml"+i).textContent=x);
    $("tmSteps").innerHTML=t.tmSteps.map(s=>`<li><div><b>${s[0]}</b><span>${s[1]}</span></div></li>`).join("");
    $("tgrid").innerHTML=t.tests.map(x=>`<div class="tcard"><span class="t">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><span class="basis">${x[3]}</span></div>`).join("");
    $("srcList").innerHTML=SRC.map(s=>`<span>${s}</span>`).join("");
    const v=$("vid"), src=`video/contratando-${lang}.mp4`;
    if(!$("vsrc").getAttribute("src").endsWith(src)){ $("vsrc").setAttribute("src",src); v.setAttribute("poster",`video/poster-${lang}.jpg`); v.load(); }
  }

  function renderPrices(){
    const t=L(), vr=money(VOICE), su=money(SETUP);
    const vals={voice:vr,fee:money(FEE_B),setup:su,setupB:money(SETUP_B),min:money(MIN_B),t0:money(TESTS[0]),t6:money(TESTS[6]),v:vr,sal:money(SMLV)};
    $("f1v").textContent=money(SMLV);
    $("f1t").innerHTML=fill(t.f1,{aux:money(AUX)});
    $("f2v").textContent=`${pctTxt(25)} → ${pctTxt(10)}`;
    $("f3v").textContent=money(SMLV*12*0.15);
    $("f4v").textContent=money(SMLV*PCT_A);
    $("roleBody").innerHTML=ROLES.map(r=>{
      const rn=t.roles[r.k], comp=r.sal*12*0.15, a=r.sal*PCT_A;
      return `<tr><td><div class="role">${rn[0]}</div><div class="sub">${rn[1]}</div></td>
        <td class="num">${rn[2]}</td>
        <td><div class="tests">${r.tests.map(x=>`<span class="t">${x}</span>`).join("")}</div></td>
        <td class="r num">${money(comp)}<div class="sub">${money(r.sal)}</div></td>
        <td class="r"><div class="price num">${money(a)}</div><div class="save num">${pctTxt(Math.round((1-a/comp)*100))} ${t.less}</div></td></tr>`;}).join("");
    const rng=(a,b)=>`${money(a)}–${money(b)}`;
    const tv=[[money(101150),money(101150*6),money(101150*6*4)],["—",money(249900),money(249900*4)],["—",rng(60000,250000),rng(240000,1000000)],
              ...[0,6].map(k=>["—",money(TESTS[k]),money(TESTS[k]*4)])];
    $("testBody").innerHTML=t.tRows.map((row,i)=>`<tr${i>=3?' class="ours"':''}><td><div class="role">${row[0]}</div><div class="sub">${row[1]}</div></td>${tv[i].map(x=>`<td class="r num">${x}</td>`).join("")}</tr>`).join("");
    const mv={a:money(175395),b:cur==="USD"?rng(15*TRM,55*TRM):rng(Math.round(15*TRM/1000)*1000,Math.round(55*TRM/1000)*1000),setup:su};
    $("mkBody").innerHTML=t.mk.map((r,i)=>`<tr${i===t.mk.length-1?' class="ours"':''}><td class="role">${r[0]}</td>${r.slice(1).map(c=>`<td class="num">${fill(c,mv)}</td>`).join("")}</tr>`).join("");
    $("dfGrid").innerHTML=t.dfRows.map((r,i)=>`<div class="panel${i?" df-us":""}"><h3>${r[0]}</h3><p class="note" style="font-size:.92rem">${r[1]}</p></div>`).join("");
    // Opciones
    const ul=items=>`<ul>${items.map(b=>`<li>${fill(b,vals)}</li>`).join("")}</ul>`;
    const bands=`<p class="sub">${t.bandCap}</p><ul class="bandlist" id="bandList">${BANDS.map((b,i)=>`<li data-b="${i}"><span>${bandLabel(b)}</span><b>${fill(t.bandPct,{p:pctTxt(b[2])})}</b></li>`).join("")}</ul>`;
    const opt=(cls,tag,m,withSetup,withBands)=>`<article class="model ${cls}"><span class="tag">${tag}</span><h3>${m[0]}</h3><p class="sub">${m[1]}</p>
      ${ul(withSetup?[t.setupB].concat(m[2]):m[2])}${withBands?bands:""}
      <p class="who"><b>${m[3]}</b> ${m[4]}</p></article>`;
    $("models").innerHTML=opt("mA",t.optA,t.mA,true,true)+opt("mB",t.optB,t.mB,false,false);
    // ejemplo de ahorro: 300 agentes con salario mínimo en la primera banda
    const N=300, b1=BANDS[0][2]/100, firmT=SMLV*12*0.15*N;
    const col=k=>{const per=SMLV*b1*TERMF[k], tot=per*N, te=TESTS[k]*4*N, all=tot+te; return {k,per,tot,te,all};};
    const C=[0,6].map(col), base=C[0].all;
    t.svCols.forEach((c,i)=>$("sv"+i).textContent=c); $("svP").textContent=t.svP; $("svNote").textContent=fill(t.svNote,{firm:money(firmT)});
    const cell=(v,cls)=>`<td class="r num${cls||""}">${v}</td>`;
    const rowsSv=[
      C.map(c=>cell(`<span class="price">${pctTxt(Math.round(BANDS[0][2]*TERMF[c.k]*100)/100)}</span>`)),
      C.map(c=>cell(money(c.per))),
      C.map(c=>cell(money(c.tot))),
      C.map(c=>cell(money(c.te))),
      C.map(c=>cell(`<b>${money(c.all)}</b>`)),
      C.map((c,i)=>cell(i?`<span class="save">${money(base-c.all)}</span>`:"—")),
      C.map(c=>cell(`<span class="save">${money(firmT-c.all)}</span>`))];
    $("svBody").innerHTML=rowsSv.map((r,i)=>`<tr${i>=5?' class="ours"':''}><td class="role">${t.svRows[i]}</td>${r.join("")}</tr>`).join("");
    t.btCols.forEach((c,i)=>$("bt"+i).textContent=c); t.ppCols.forEach((c,i)=>$("pp"+i).textContent=c); $("btP").textContent=fill(t.btP,vals);
    $("btBody").innerHTML=BANDS.map((b,i)=>`<tr><td class="role">${bandLabel(b)}</td>${[0,6].map(k=>`<td class="r"><div class="price num">${pctTxt(Math.round(b[2]*TERMF[k]*100)/100)}</div><div class="sub num">${money(SMLV*b[2]/100*TERMF[k])}</div></td>`).join("")}</tr>`).join("");
    $("addons").innerHTML=`<div class="addon"><h3>${t.adT}</h3><p>${t.adP}</p><div class="pp">${t.adPs.map(x=>`<span>${fill(x,vals)}</span>`).join("")}</div></div>
      <div class="addon"><h3>${t.avT}</h3><p>${t.avP}</p><div class="pp"><span>${fill(t.avPr,vals)}</span></div></div>`;
    $("plS").innerHTML=t.plS.map(s=>`<li><div><b>${s[0]}</b><span>${fill(s[1],vals)}</span></div></li>`).join("");
    $("conds").innerHTML=t.conds.map(c=>`<div class="cond"><h3>${c[0]}</h3><p>${fill(c[1],vals)}</p></div>`).join("");
    $("qualBody").innerHTML=t.qual.map(q=>`<tr><td class="role">${q[0]}</td><td>${fill(q[1],vals)}</td><td>${fill(q[2],vals)}</td></tr>`).join("");
    calc();
  }

  function calcTime(){
    const t=L(), n=50, m1=num("tm1"), m2=num("tm2"), pr=num("tm3")/100;
    const r=[n*m1, n*m2, n*pr*m1], tot=r.reduce((a,b)=>a+b,0);
    const h=v=>{const x=v/60; return new Intl.NumberFormat(locale(),{maximumFractionDigits:1}).format(x)+" h";};
    $("tmBody").innerHTML=t.tmRows.map((x,i)=>`<tr><td>${x}</td><td class="r num">${h(r[i])}</td></tr>`).join("")+`<tr><td><b>${t.tmTot}</b></td><td class="r num"><b class="price">${h(tot)}</b></td></tr>`;
    $("tmDays").textContent=fill(t.tmDays,{d:new Intl.NumberFormat(locale(),{maximumFractionDigits:1}).format(tot/60/8)});
  }
  function calc(){
    calcTime();
    const t=L(), pct=num("pct")/100, pagos=num("pagos"), tf=TERMF[term];
    const ev=num("ev"), testsPH=ev*TESTS[term], voicePH=num("iv")*num("mins")*VOICE;
    let people=0, types=0; ROLES.forEach((r,i)=>{const p=num("p"+i); people+=p; if(p>0) types++;});
    const band=bandOf(Math.max(people,1)), bp=band[2]/100, setupT=types*SETUP;
    let tot={M:0,A:0}, testsM=0, voiceM=0;
    const rows=ROLES.map((r,i)=>{
      const p=num("p"+i), s=num("s"+i)*COUNTRIES[country].fx;
      const M=s*pagos*pct, A=s*bp*tf+testsPH+voicePH;
      tot.M+=p*M; tot.A+=p*A; testsM+=p*testsPH; voiceM+=p*voicePH;
      return {r,p,M,A};
    });
    const sv=(m,a)=>m>0?`${money(m-a)}<div class="save num">${pctTxt(Math.round((1-a/m)*100))} ${t.less}</div>`:"—";
    $("cmpBody").innerHTML=rows.map(x=>`<tr><td><div class="role">${t.roles[x.r.k][0]}</div><div class="sub num">${x.p} ${t.perMonth}</div></td><td class="r num">${money(x.M)}</td><td class="r num win">${money(x.A)}</td><td class="r num">${sv(x.M,x.A)}</td></tr>`).join("");
    $("cmpFoot").innerHTML=`<tr><td>${t.totalM} · ${people}</td><td class="r num">${money(tot.M)}</td><td class="r num win">${money(tot.A)}</td><td class="r num">${sv(tot.M,tot.A)}</td></tr>
      <tr><td>${fill(t.setupRow,{n:types})}</td><td class="r">—</td><td class="r num">${money(setupT)}</td><td class="r">—</td></tr>`;
    const max=Math.max(tot.M,tot.A,1);
    const items=[["M",t.avgM,tot.M,"m"],["A",t.optA,tot.A,""]];
    $("bars").innerHTML=items.map(([k,lab,v,cls])=>{
      const s=k==="M"?"":`<span class="meta num">${tot.M>0?pctTxt(Math.round((1-v/tot.M)*100))+" "+t.less:""} · ${fill(t.setupMeta,{x:money(setupT)})}</span>`;
      return `<div class="bar"><div class="lab"><span><b>${lab}</b></span><span class="num">${money(v)} ${t.perMonth}</span></div>
        <div class="track"><div class="fill ${cls}" style="width:${(v/max*100).toFixed(1)}%"></div></div>${s}</div>`;}).join("");
    $("hBest").textContent=`${money(tot.A)} ${t.perMonth}`;
    $("hBestSub").textContent=fill(t.bestSub,{pct:tot.M>0?pctTxt(Math.round((1-tot.A/tot.M)*100)):"—",save:money((tot.M-tot.A)*12)});
    $("bandNote").textContent=fill(t.bandNote,{n:people,p:pctTxt(Math.round(band[2]*tf*100)/100),term:t["term"+term].toLowerCase()});
    const pp=v=>people>0?money(v/people):"—";
    $("ppBody").innerHTML=`<tr><td class="role">${t.optA}</td><td class="r num">${pp(tot.A+setupT)}</td><td class="r num">${pp(tot.A)}</td></tr><tr><td class="role">${t.avgM}</td><td class="r num">${pp(tot.M)}</td><td class="r num">${pp(tot.M)}</td></tr>`;
    $("bNote").textContent=fill(t.bNote,{tests:money(testsM),voice:money(voiceM)});
    document.querySelectorAll("#bandList li").forEach(li=>li.classList.toggle("on",BANDS[+li.dataset.b]===band));
    $("sumgrid").innerHTML=`<div><span class="tag" style="color:var(--accent)">${t.optA}</span><span class="amt num">${money(tot.A)} ${t.perMonth}</span><span class="sub num">${fill(t.setupMeta,{x:money(setupT)})} · ${t.sumMix}</span><span class="sub">${t.sum.A}</span></div>
      <div><span class="tag" style="color:var(--b)">${t.optB}</span><span class="amt">${t.bLater}</span><span class="sub">${t.sum.B}</span></div>`;
  }

  function setCountry(k){
    country=k; const C=COUNTRIES[k];
    $("minw").value=C.min; $("minw").step=C.step; $("pagos").value=C.pagos;
    ROLES.forEach((r,i)=>{const el=$("s"+i); el.step=C.step; el.value=C.sal?C.sal[r.k]:Math.round(C.min*RATIO[r.k]/C.step)*C.step;});
    renderStatic(); calc();
  }
  document.addEventListener("change",e=>{if(e.target.id==="ctry") setCountry(e.target.value);});
  document.addEventListener("input",e=>{if(e.target.id==="minw"){const C=COUNTRIES[country]; const m=num("minw");
    ROLES.forEach((r,i)=>{ if(!C.sal||r.k==="loc") $("s"+i).value=r.k==="loc"?m:Math.round(m*RATIO[r.k]/C.step)*C.step; }); calc();}});
  document.querySelectorAll("#themeSeg button").forEach(b=>b.addEventListener("click",()=>{theme=b.dataset.themeSet;store.set("xtco-theme",theme);applyTheme();}));
  document.querySelectorAll("#langSeg button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;store.set("xtco-lang",lang);renderStatic();renderPrices();}));
  document.querySelectorAll("#curSeg button").forEach(b=>b.addEventListener("click",()=>{cur=b.dataset.cur;store.set("xtco-cur",cur);renderStatic();renderPrices();}));
  document.querySelectorAll("#termSeg button").forEach(b=>b.addEventListener("click",()=>{term=+b.dataset.term;renderStatic();calc();}));
  document.addEventListener("input",e=>{if(e.target.matches("input"))calc();});
  renderStatic(); renderPrices(); applyTheme();
})();

</script>

</body>
</html>
